<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfcff"/>
      <stop offset="1" stop-color="#f6fbff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79d7ff"/>
      <stop offset="1" stop-color="#3178ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbf7a"/>
      <stop offset="1" stop-color="#ff765f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7efbe"/>
      <stop offset="1" stop-color="#2fb16e"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1d2b3a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#263445"/>
    </marker>
    <style>
      .title{font:800 32px Arial, sans-serif;fill:#172033}
      .sub{font:500 16px Arial, sans-serif;fill:#64748b}
      .h{font:800 20px Arial, sans-serif;fill:#172033}
      .txt{font:600 15px Arial, sans-serif;fill:#334155}
      .tiny{font:500 13px Arial, sans-serif;fill:#64748b}
      .frame{fill:white;stroke:#1f2937;stroke-width:2.4;stroke-dasharray:9 8}
      .card{fill:white;stroke:#d7e0ea;stroke-width:2;filter:url(#shadow)}
      .arrow{stroke:#263445;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .soft{stroke:#94a3b8;stroke-width:2.2;fill:none;stroke-dasharray:7 7;marker-end:url(#arrow)}
      .topic{font:700 15px Arial, sans-serif;fill:white}
      .node{fill:#f8fbff;stroke:#8aa0ba;stroke-width:2}
      .path{stroke:#23ad65;stroke-width:4.5;fill:none;stroke-linecap:round;stroke-dasharray:10 8}
      .traj{stroke:#f97316;stroke-width:4.5;fill:none;stroke-linecap:round}
      .obs{fill:#c7833a;stroke:#68411f;stroke-width:2}
      .robot{fill:#2f6df6;stroke:#152238;stroke-width:3}
    </style>
  </defs>
  <rect width="1500" height="760" fill="url(#bg)"/>
  <text x="750" y="56" text-anchor="middle" class="title">Figure 2. V-PRM + Contouring MPC Architecture</text>
  <text x="750" y="84" text-anchor="middle" class="sub">laser perception · topology-aware global path · real-time MPC tracking · velocity command</text>
  <rect x="66" y="122" width="1368" height="568" rx="34" class="frame"/>

  <g transform="translate(110 170)">
    <rect width="250" height="190" rx="24" class="card"/>
    <circle cx="48" cy="46" r="25" fill="url(#blue)"/>
    <text x="48" y="53" text-anchor="middle" class="topic">01</text>
    <text x="88" y="45" class="h">Sensors</text>
    <text x="88" y="72" class="tiny">/scan + /odom</text>
    <path d="M78 132 L138 98 L208 132" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="78" cy="132" r="9" fill="#2563eb"/>
    <line x1="78" y1="132" x2="38" y2="105" stroke="#f59e0b" stroke-width="2"/>
    <line x1="78" y1="132" x2="38" y2="132" stroke="#f59e0b" stroke-width="2"/>
    <line x1="78" y1="132" x2="38" y2="159" stroke="#f59e0b" stroke-width="2"/>
    <text x="126" y="164" text-anchor="middle" class="txt">range + pose</text>
  </g>

  <g transform="translate(445 150)">
    <rect width="300" height="230" rx="24" class="card"/>
    <circle cx="52" cy="48" r="25" fill="url(#green)"/>
    <text x="52" y="55" text-anchor="middle" class="topic">02</text>
    <text x="96" y="47" class="h">V-PRM Planner</text>
    <text x="96" y="74" class="tiny">topology-aware reference path</text>
    <rect x="52" y="112" width="196" height="82" rx="12" class="node"/>
    <circle cx="78" cy="162" r="9" fill="#2563eb"/>
    <circle cx="225" cy="126" r="11" fill="#ffd84d" stroke="#8a6700" stroke-width="2"/>
    <rect x="128" y="132" width="28" height="40" rx="5" class="obs"/>
    <path d="M78 162 C118 120 161 198 225 126" class="path"/>
  </g>

  <g transform="translate(830 150)">
    <rect width="300" height="230" rx="24" class="card"/>
    <circle cx="52" cy="48" r="25" fill="url(#orange)"/>
    <text x="52" y="55" text-anchor="middle" class="topic">03</text>
    <text x="96" y="47" class="h">Obstacle Model</text>
    <text x="96" y="74" class="tiny">ellipsoid or half-space</text>
    <rect x="50" y="110" width="80" height="52" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="90" y="142" text-anchor="middle" class="txt">soft</text>
    <rect x="168" y="110" width="80" height="52" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="208" y="142" text-anchor="middle" class="txt">hard</text>
    <text x="150" y="194" text-anchor="middle" class="tiny">N_ELL=12 or NH=12</text>
  </g>

  <g transform="translate(1190 170)">
    <rect width="210" height="190" rx="24" class="card"/>
    <circle cx="50" cy="46" r="25" fill="url(#blue)"/>
    <text x="50" y="53" text-anchor="middle" class="topic">04</text>
    <text x="94" y="45" class="h">MPC</text>
    <text x="94" y="72" class="tiny">acados SQP-RTI</text>
    <path d="M56 136 C96 84 142 188 178 118" class="traj"/>
    <circle cx="56" cy="136" r="10" class="robot"/>
    <path d="M174 118 L190 110" class="arrow"/>
  </g>

  <path d="M360 265 C394 265 410 265 445 265" class="arrow"/>
  <path d="M745 265 C782 265 793 265 830 265" class="arrow"/>
  <path d="M1130 265 C1160 265 1166 265 1190 265" class="arrow"/>

  <g transform="translate(210 470)">
    <rect width="250" height="120" rx="22" class="card"/>
    <text x="125" y="42" text-anchor="middle" class="h">Reference Path</text>
    <text x="125" y="75" text-anchor="middle" class="txt">/reference_path</text>
    <path d="M50 94 C92 72 140 105 200 56" class="path"/>
  </g>
  <g transform="translate(628 470)">
    <rect width="250" height="120" rx="22" class="card"/>
    <text x="125" y="42" text-anchor="middle" class="h">Warm Start</text>
    <text x="125" y="75" text-anchor="middle" class="txt">shift + radial projection</text>
  </g>
  <g transform="translate(1046 470)">
    <rect width="250" height="120" rx="22" class="card"/>
    <text x="125" y="42" text-anchor="middle" class="h">Command</text>
    <text x="125" y="75" text-anchor="middle" class="txt">/cmd_vel</text>
    <text x="125" y="100" text-anchor="middle" class="tiny">stop at goal radius</text>
  </g>

  <path d="M360 470 C390 420 430 380 500 350" class="soft"/>
  <path d="M745 380 C710 415 700 440 710 470" class="soft"/>
  <path d="M980 380 C1015 420 1070 440 1160 470" class="soft"/>
  <path d="M460 530 C520 530 568 530 628 530" class="arrow"/>
  <path d="M878 530 C938 530 986 530 1046 530" class="arrow"/>

  <rect x="345" y="632" width="810" height="42" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="750" y="658" text-anchor="middle" class="txt">Classic stack: V-PRM plans globally, contouring MPC tracks locally, obstacles enter as soft ellipsoids or hard half-spaces.</text>
</svg>
