<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#f7fbfa"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="1" stop-color="#ff6f61"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ed5ff"/>
      <stop offset="1" stop-color="#3672ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99e6b3"/>
      <stop offset="1" stop-color="#28a96b"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c6ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#263242" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L13 7 L2 12 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:800 34px Arial, sans-serif; fill:#182235}
      .sub{font:500 17px Arial, sans-serif; fill:#627084}
      .h{font:800 21px Arial, sans-serif; fill:#182235}
      .txt{font:600 15px Arial, sans-serif; fill:#334155}
      .tiny{font:500 13px Arial, sans-serif; fill:#64748b}
      .frame{fill:white;stroke:#1f2937;stroke-width:2.5;stroke-dasharray:10 8}
      .card{fill:white;stroke:#d6dee8;stroke-width:2;filter:url(#softShadow)}
      .arrow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .thin{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 8}
      .path{fill:none;stroke:#23ad65;stroke-width:5;stroke-dasharray:12 8;stroke-linecap:round}
      .trail{fill:none;stroke:#2f6df6;stroke-width:5;stroke-linecap:round}
      .wall{fill:#d6dce5;stroke:#64748b;stroke-width:2}
      .obs{fill:#c7833a;stroke:#6b4320;stroke-width:2}
      .iconStroke{stroke:#182235;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="950" fill="url(#bg)"/>

  <text x="800" y="58" text-anchor="middle" class="title">SAC-Based MuJoCo Navigation for Tracked UGV</text>
  <text x="800" y="88" text-anchor="middle" class="sub">expert warm start · off-policy SAC update · continuous-goal GUI validation · lightweight deployment guard</text>

  <rect x="70" y="126" width="1460" height="720" rx="34" class="frame"/>

  <g transform="translate(112 156)">
    <rect width="388" height="330" rx="28" class="card"/>
    <circle cx="55" cy="54" r="28" fill="url(#orange)"/>
    <text x="55" y="62" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="white">01</text>
    <text x="104" y="50" class="h">MuJoCo Digital Twin</text>
    <text x="104" y="77" class="tiny">tracked chassis, contacts, walls, boxes</text>

    <rect x="44" y="108" width="296" height="168" rx="12" fill="#f8fbff" stroke="#8aa0ba" stroke-width="2"/>
    <rect x="44" y="108" width="296" height="14" class="wall"/>
    <rect x="44" y="262" width="296" height="14" class="wall"/>
    <rect x="44" y="108" width="14" height="168" class="wall"/>
    <rect x="326" y="108" width="14" height="168" class="wall"/>
    <rect x="104" y="160" width="42" height="62" rx="7" class="obs"/>
    <rect x="195" y="135" width="58" height="45" rx="7" class="obs"/>
    <path d="M86 236 C126 210 155 174 206 166 C252 158 268 132 300 128" class="path"/>
    <path d="M84 237 C125 226 145 205 180 185 C220 163 252 145 300 129" class="trail"/>
    <circle cx="86" cy="237" r="18" fill="#3478f6" stroke="#182235" stroke-width="3"/>
    <path d="M86 237 L113 224" class="iconStroke" marker-end="url(#arrow)"/>
    <circle cx="300" cy="128" r="18" fill="#ffd84d" stroke="#8a6700" stroke-width="3"/>

    <text x="44" y="306" class="txt">Observation: lidar + guide + odom</text>
  </g>

  <g transform="translate(606 156)">
    <rect width="388" height="330" rx="28" class="card"/>
    <circle cx="55" cy="54" r="28" fill="url(#blue)"/>
    <text x="55" y="62" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="white">02</text>
    <text x="104" y="50" class="h">SAC Training Core</text>
    <text x="104" y="77" class="tiny">actor-critic with expert replay</text>

    <circle cx="194" cy="173" r="82" fill="#f6fbff" stroke="#6b9dff" stroke-width="9"/>
    <circle cx="194" cy="173" r="49" fill="#ffffff" stroke="#9bc6ff" stroke-width="2"/>
    <text x="194" y="165" text-anchor="middle" font-family="Arial" font-size="26" font-weight="800" fill="#2563eb">SAC</text>
    <text x="194" y="192" text-anchor="middle" class="tiny">actor + critic</text>

    <rect x="38" y="260" width="130" height="40" rx="13" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="103" y="285" text-anchor="middle" class="tiny">BC warm start</text>
    <rect x="220" y="260" width="130" height="40" rx="13" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="285" y="285" text-anchor="middle" class="tiny">replay buffer</text>
    <path d="M139 260 C140 232 162 215 180 205" class="arrow"/>
    <path d="M254 260 C246 232 226 215 208 205" class="arrow"/>
  </g>

  <g transform="translate(1100 156)">
    <rect width="360" height="330" rx="28" class="card"/>
    <circle cx="55" cy="54" r="28" fill="url(#purple)"/>
    <text x="55" y="62" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="white">03</text>
    <text x="104" y="50" class="h">Policy Output</text>
    <text x="104" y="77" class="tiny">continuous velocity command</text>

    <rect x="65" y="124" width="230" height="72" rx="18" fill="#faf7ff" stroke="#8b5cf6" stroke-width="3"/>
    <text x="180" y="154" text-anchor="middle" class="txt">a = [ v, w ]</text>
    <text x="180" y="179" text-anchor="middle" class="tiny">linear + angular velocity</text>
    <path d="M99 245 C150 210 210 214 260 246" fill="none" stroke="#ff725e" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="180" y="288" text-anchor="middle" class="txt">tracked-base command</text>
  </g>

  <path d="M500 320 C548 320 558 320 606 320" class="arrow"/>
  <path d="M994 320 C1042 320 1052 320 1100 320" class="arrow"/>

  <g transform="translate(122 566)">
    <rect width="300" height="176" rx="24" class="card"/>
    <circle cx="50" cy="48" r="24" fill="url(#green)"/>
    <text x="50" y="56" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="white">A</text>
    <text x="92" y="46" class="h">Guide Source</text>
    <text x="92" y="73" class="tiny">Visibility-PRM / A* path</text>
    <path d="M48 126 C95 98 135 146 178 112 C213 85 238 100 260 76" class="path"/>
    <circle cx="48" cy="126" r="10" fill="#3478f6"/>
    <circle cx="260" cy="76" r="12" fill="#ffd84d" stroke="#8a6700" stroke-width="2"/>
  </g>

  <g transform="translate(498 566)">
    <rect width="300" height="176" rx="24" class="card"/>
    <circle cx="50" cy="48" r="24" fill="url(#orange)"/>
    <text x="50" y="56" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="white">B</text>
    <text x="92" y="46" class="h">Heading Guard</text>
    <text x="92" y="73" class="tiny">deployment speed limiter</text>
    <text x="42" y="116" class="txt">large heading error</text>
    <rect x="188" y="96" width="74" height="36" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="225" y="120" text-anchor="middle" class="txt">slow v</text>
    <text x="42" y="148" class="tiny">turn first, then accelerate</text>
  </g>

  <g transform="translate(874 566)">
    <rect width="300" height="176" rx="24" class="card"/>
    <circle cx="50" cy="48" r="24" fill="url(#blue)"/>
    <text x="50" y="56" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="white">C</text>
    <text x="92" y="46" class="h">GUI Validation</text>
    <text x="92" y="73" class="tiny">continuous goals in one scene</text>
    <text x="44" y="122" class="txt">10 / 10 arrived</text>
    <text x="44" y="150" class="txt">0 collision, 0 timeout</text>
  </g>

  <g transform="translate(1250 566)">
    <rect width="190" height="176" rx="24" class="card"/>
    <circle cx="95" cy="74" r="44" fill="#fff7ed" stroke="#fb923c" stroke-width="8"/>
    <text x="95" y="80" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#f97316">SAC</text>
    <text x="95" y="132" text-anchor="middle" class="txt">GitHub Demo</text>
    <text x="95" y="156" text-anchor="middle" class="tiny">code + figures</text>
  </g>

  <path d="M422 654 C456 654 464 654 498 654" class="arrow"/>
  <path d="M798 654 C832 654 840 654 874 654" class="arrow"/>
  <path d="M1174 654 C1208 654 1216 654 1250 654" class="arrow"/>
  <path d="M272 566 C380 506 500 486 650 486" class="thin"/>
  <path d="M648 566 C742 508 882 490 1180 486" class="thin"/>

  <rect x="250" y="810" width="1100" height="54" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="800" y="833" text-anchor="middle" class="txt">Figure 2. Overall workflow of SAC navigation training and continuous-goal validation.</text>
  <text x="800" y="856" text-anchor="middle" class="tiny">The heading guard is not a planner; it only caps forward speed during large heading changes.</text>
</svg>
